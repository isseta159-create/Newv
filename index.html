<script>
/* Apply saved theme before first paint to avoid a flash. */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem("vector:settings") || "{}");
    if (s.theme === "light" || s.theme === "dark") {
      document.documentElement.dataset.theme = s.theme;
    }
  } catch (e) {}
})();
</script>

<style>
/* ───────────────────────── Tokens ───────────────────────── */
:root {
  --font-d: "Gabarito", system-ui, sans-serif;
  --font-b: "Hanken Grotesk", system-ui, sans-serif;
  --font-m: "Spline Sans Mono", ui-monospace, "SF Mono", monospace;

  --bg: #F5F4F0;
  --bg-glass: rgba(245, 244, 240, 0.86);
  --card: #FFFFFF;
  --inset: #EFECE5;
  --inset-2: #E9E5DC;
  --line: #E6E1D7;
  --line-2: #D6CFC2;
  --ink: #221D18;
  --sub: #6E665B;
  --faint: #A39988;
  --brand: #B05E22;
  --brand-ink: #9A4E16;
  --on-brand: #FFF8F1;
  --on-ink: #F7F5F1;
  --ok: #2F7D46;
  --warn: #BB3A52;
  --shadow-card: 0 1px 2px rgba(40, 28, 16, 0.04), 0 10px 28px -18px rgba(40, 28, 16, 0.22);
  --shadow-pop: 0 2px 6px rgba(40, 28, 16, 0.08), 0 18px 44px -18px rgba(40, 28, 16, 0.30);
  --backdrop: rgba(34, 26, 18, 0.34);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15110D;
    --bg-glass: rgba(21, 17, 13, 0.84);
    --card: #1F1913;
    --inset: #28211A;
    --inset-2: #312921;
    --line: #322A21;
    --line-2: #443A2E;
    --ink: #F1EBE1;
    --sub: #AB9F90;
    --faint: #79705F;
    --brand: #E08A4E;
    --brand-ink: #ECA677;
    --on-brand: #2A1505;
    --on-ink: #1B1610;
    --ok: #79CE92;
    --warn: #EE8AA0;
    --shadow-card: 0 0 0 1px rgba(255, 240, 220, 0.02);
    --shadow-pop: 0 18px 50px -16px rgba(0, 0, 0, 0.7);
    --backdrop: rgba(8, 6, 4, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15110D;
  --bg-glass: rgba(21, 17, 13, 0.84);
  --card: #1F1913;
  --inset: #28211A;
  --inset-2: #312921;
  --line: #322A21;
  --line-2: #443A2E;
  --ink: #F1EBE1;
  --sub: #AB9F90;
  --faint: #79705F;
  --brand: #E08A4E;
  --brand-ink: #ECA677;
  --on-brand: #2A1505;
  --on-ink: #1B1610;
  --ok: #79CE92;
  --warn: #EE8AA0;
  --shadow-card: 0 0 0 1px rgba(255, 240, 220, 0.02);
  --shadow-pop: 0 18px 50px -16px rgba(0, 0, 0, 0.7);
  --backdrop: rgba(8, 6, 4, 0.55);
  color-scheme: dark;
}

/* ───────────────────────── Base ───────────────────────── */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior-y: none; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-b);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  transition: background 0.25s ease, color 0.25s ease;
}
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
input, select, textarea { font-family: var(--font-b); font-size: 16px; color: var(--ink); }
a { color: var(--brand-ink); text-decoration: none; }
.display { font-family: var(--font-d); letter-spacing: -0.01em; }
.mono { font-family: var(--font-m); font-variant-numeric: tabular-nums; }
.sub { color: var(--sub); }
.faint { color: var(--faint); }

.app { min-height: 100vh; padding-bottom: 132px; }
.shell { max-width: 430px; margin: 0 auto; padding: 0 16px; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }
.noscroll::-webkit-scrollbar { display: none; }
.noscroll { scrollbar-width: none; }

:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }

/* ───────────────────────── Header ───────────────────────── */
.hdr {
  position: sticky; top: 0; z-index: 30;
  background: var(--bg-glass);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.hdr-in { max-width: 480px; margin: 0 auto; padding: 0 16px; }
.hdr-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; }
.wordmark { display: flex; align-items: center; gap: 9px; }
.wordmark .name { font-family: var(--font-d); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
.wordmark .date { font-size: 12.5px; color: var(--sub); margin-top: 1px; }
.iconbtn {
  width: 38px; height: 38px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: var(--sub); background: var(--card); border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
  transition: transform 0.12s ease, background 0.15s ease;
}
.iconbtn:active { transform: scale(0.94); }

/* Week strip */
.week { display: flex; gap: 6px; overflow-x: auto; padding: 2px 16px 10px; margin: 0 -16px; }
.day {
  flex: 0 0 auto; width: 47px; padding: 7px 0 6px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  border-radius: 13px; border: 1px solid transparent;
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
}
.day:active { transform: scale(0.93); }
.day .dow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); }
.day .num { font-family: var(--font-d); font-weight: 700; font-size: 17px; color: var(--sub); line-height: 1.15; }
.day .dot { width: 4px; height: 4px; border-radius: 99px; background: transparent; margin-top: 2px; }
.day.logged .dot { background: var(--brand); }
.day.active { background: var(--card); border-color: var(--line); box-shadow: var(--shadow-card); }
.day.active .num { color: var(--ink); }
.day.today .dow { color: var(--brand-ink); }

/* Past-day banner */
.pastbar {
  margin-top: 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--inset); border: 1px dashed var(--line-2); border-radius: 14px;
  padding: 9px 12px 9px 14px; font-size: 13.5px; color: var(--sub);
}
.pastbar b { color: var(--ink); font-weight: 600; }
.pastbar button { color: var(--brand-ink); font-weight: 600; font-size: 13.5px; padding: 4px 6px; }

/* ───────────────────────── Cards & sections ───────────────────────── */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  box-shadow: var(--shadow-card);
}
.card.pad { padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.sect-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sect-title { font-family: var(--font-d); font-weight: 700; font-size: 17px; }
.sect-sub { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
.kicker { font-size: 12px; font-weight: 600; color: var(--sub); letter-spacing: 0.02em; }

.list-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-top: 1px solid var(--line);
}
.list-row:first-child, .list-head + .list-row { border-top: none; }
.list-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  background: var(--inset); border-radius: 19px 19px 0 0;
  font-size: 12.5px; font-weight: 600;
}
.swatch { width: 8px; height: 8px; border-radius: 99px; flex: 0 0 auto; }
.bar-swatch { width: 4px; height: 34px; border-radius: 99px; flex: 0 0 auto; }
.row-x {
  width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  color: var(--faint); transition: transform 0.12s ease, color 0.15s ease, background 0.15s ease;
}
.row-x:active { transform: scale(0.9); background: var(--inset); color: var(--warn); }

.empty { text-align: center; padding: 26px 18px; }
.empty .glyph {
  width: 46px; height: 46px; margin: 0 auto 10px; border-radius: 16px;
  background: var(--inset); display: flex; align-items: center; justify-content: center; color: var(--faint);
}
.empty .t { font-family: var(--font-d); font-weight: 600; font-size: 15.5px; }
.empty .s { font-size: 13px; color: var(--sub); margin-top: 3px; }

/* ───────────────────────── Buttons & chips ───────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 15px;
  font-weight: 600; font-size: 15px; border: 1px solid transparent;
  transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; pointer-events: none; }
.btn.primary { background: var(--ink); color: var(--on-ink); box-shadow: var(--shadow-card); }
.btn.tonal { background: var(--inset); color: var(--ink); border-color: var(--line); }
.btn.ghost { color: var(--sub); }
.btn.danger { color: var(--warn); }
.btn.full { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; }

.chiprow { display: flex; gap: 7px; overflow-x: auto; padding: 2px 16px 6px; margin: 0 -16px; }
.chiprow.wrap { flex-wrap: wrap; overflow: visible; padding: 0; margin: 0; }
.chip {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 0 13px; border-radius: 99px;
  font-size: 13.5px; font-weight: 600; color: var(--sub);
  background: var(--card); border: 1px solid var(--line);
  transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.chip:active { transform: scale(0.95); }
.chip.on { color: var(--c, var(--ink)); background: var(--c-bg, var(--inset)); border-color: var(--c-br, var(--line-2)); }

.seg { display: flex; gap: 4px; background: var(--inset); border-radius: 13px; padding: 4px; }
.seg button {
  flex: 1; min-height: 36px; border-radius: 10px;
  font-size: 13.5px; font-weight: 600; color: var(--sub);
  transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
}
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow-card); }

/* ───────────────────────── Inputs ───────────────────────── */
.lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
.input, .select, .textarea {
  width: 100%; min-height: 46px; padding: 10px 13px;
  background: var(--inset); border: 1px solid var(--line); border-radius: 13px;
  outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  -webkit-appearance: none; appearance: none;
}
.textarea { resize: none; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent);
  background: var(--card);
}
.select {
  background-image: linear-gradient(45deg, transparent 50%, var(--faint) 50%), linear-gradient(135deg, var(--faint) 50%, transparent 50%);
  background-position: calc(100% - 19px) 21px, calc(100% - 14px) 21px;
  background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

/* Sliders */
input[type="range"].slider {
  -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent;
  --pct: 50%; --c: var(--brand);
}
input[type="range"].slider::-webkit-slider-runnable-track {
  height: 8px; border-radius: 99px;
  background: linear-gradient(to right, var(--c) 0 var(--pct), var(--inset-2) var(--pct) 100%);
}
input[type="range"].slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin-top: -9px;
  border-radius: 99px; background: var(--card);
  border: 2.5px solid var(--c); box-shadow: 0 2px 7px rgba(30, 20, 10, 0.22);
}
input[type="range"].slider::-moz-range-track { height: 8px; border-radius: 99px; background: var(--inset-2); }
input[type="range"].slider::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--c); }
input[type="range"].slider::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 99px; background: var(--card);
  border: 2.5px solid var(--c); box-shadow: 0 2px 7px rgba(30, 20, 10, 0.22);
}

/* ───────────────────────── Stat tiles & rings ───────────────────────── */
.tile {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 13px 14px; box-shadow: var(--shadow-card); text-align: left; width: 100%;
  transition: transform 0.12s ease;
}
button.tile:active { transform: scale(0.97); }
.tile .t-label { font-size: 12.5px; font-weight: 600; color: var(--sub); display: flex; align-items: center; gap: 6px; }
.tile .t-value { font-family: var(--font-d); font-weight: 700; font-size: 24px; line-height: 1.2; margin-top: 4px; }
.tile .t-unit { font-size: 13px; font-weight: 500; color: var(--faint); margin-left: 3px; }
.tile .t-sub { font-size: 12px; color: var(--faint); margin-top: 2px; }

.ringtile { display: flex; align-items: center; gap: 12px; }
.ring-svg { transform: rotate(-90deg); flex: 0 0 auto; }
.ring-track { stroke: var(--inset-2); }
.ring-arc { transition: stroke-dashoffset 0.6s cubic-bezier(0.3, 0.8, 0.3, 1); }

/* ───────────────────────── Dock ───────────────────────── */
.dock-wrap {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
  pointer-events: none;
}
.dock {
  pointer-events: auto;
  max-width: 400px; margin: 0 auto;
  background: var(--bg-glass);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border: 1px solid var(--line); border-radius: 26px;
  box-shadow: var(--shadow-pop);
  display: flex; align-items: stretch; padding: 6px;
}
.dock-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 0 7px; border-radius: 18px; color: var(--faint);
  transition: color 0.15s ease, transform 0.12s ease, background 0.15s ease;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;
}
.dock-tab:active { transform: scale(0.92); }
.dock-tab.on { color: var(--brand-ink); }
.dock-plus { flex: 0 0 64px; display: flex; align-items: center; justify-content: center; }
.plusbtn {
  width: 54px; height: 54px; margin-top: -22px; border-radius: 99px;
  background: var(--brand); color: var(--on-brand);
  display: flex; align-items: center; justify-content: center;
  border: 4px solid var(--bg);
  box-shadow: 0 10px 24px -8px color-mix(in srgb, var(--brand) 55%, transparent);
  transition: transform 0.15s cubic-bezier(0.3, 1.4, 0.5, 1);
}
.plusbtn:active { transform: scale(0.9) rotate(90deg); }

/* ───────────────────────── Sheets ───────────────────────── */
.sheet-bg {
  position: fixed; inset: 0; z-index: 50; background: var(--backdrop);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.sheet-bg.closing { animation: fadeOut 0.18s ease forwards; }
.sheet {
  width: 100%; max-width: 480px; max-height: 90dvh;
  background: var(--card); border-radius: 26px 26px 0 0;
  border: 1px solid var(--line); border-bottom: none;
  box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column; overflow: hidden;
  animation: sheetUp 0.32s cubic-bezier(0.22, 1.1, 0.36, 1);
}
.sheet-bg.closing .sheet { animation: sheetDown 0.18s ease forwards; }
.sheet-grab { width: 40px; height: 4.5px; border-radius: 99px; background: var(--line-2); margin: 9px auto 0; flex: 0 0 auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 18px 13px; }
.sheet-title { font-family: var(--font-d); font-weight: 700; font-size: 19px; }
.sheet-sub { font-size: 12.5px; color: var(--sub); margin-top: 1px; }
.sheet-body { overflow-y: auto; padding: 0 18px 18px; }
.sheet-foot { display: flex; gap: 10px; padding: 13px 18px calc(env(safe-area-inset-bottom, 0px) + 14px); border-top: 1px solid var(--line); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(60px); opacity: 0.4; } to { transform: none; opacity: 1; } }
@keyframes sheetDown { to { transform: translateY(80px); opacity: 0; } }

/* ───────────────────────── Toast ───────────────────────── */
.toast-wrap {
  position: fixed; left: 16px; right: 16px; z-index: 60;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 104px);
  display: flex; justify-content: center; pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: 10px;
  background: var(--ink); color: var(--on-ink);
  border-radius: 16px; padding: 11px 14px 11px 12px;
  box-shadow: var(--shadow-pop); max-width: 100%;
  animation: toastIn 0.34s cubic-bezier(0.2, 1.2, 0.35, 1);
}
.toast .msg { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast .undo { color: var(--brand); font-weight: 700; font-size: 13.5px; padding: 4px 6px; flex: 0 0 auto; }
:root[data-theme="dark"] .toast .undo { color: #F0A368; }
.toast .tick {
  width: 22px; height: 22px; border-radius: 99px; flex: 0 0 auto;
  background: var(--ok); color: var(--card);
  display: flex; align-items: center; justify-content: center;
  animation: pop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1);
}
@keyframes toastIn { from { transform: translateY(16px) scale(0.94); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }

/* ───────────────────────── Quick add ───────────────────────── */
.qa-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
.qa-tile {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 14px 4px 12px; border-radius: 17px;
  background: var(--inset); border: 1px solid var(--line);
  font-size: 12px; font-weight: 600; color: var(--ink);
  transition: transform 0.12s ease, background 0.15s ease;
}
.qa-tile:active { transform: scale(0.93); }
.qa-ico {
  width: 38px; height: 38px; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  color: var(--c, var(--ink)); background: var(--c-bg, var(--card));
}

/* ───────────────────────── Misc ───────────────────────── */
.fade { animation: fadeUp 0.3s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.phase-chip {

const STORE_PREFIX = "vector:";
const store = {
  get(k) { try { const v = localStorage.getItem(STORE_PREFIX + k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(STORE_PREFIX + k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(STORE_PREFIX + k); return true; } catch { return false; } },
  list(prefix) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(STORE_PREFIX + prefix)) keys.push(k.slice(STORE_PREFIX.length));
    }
    return keys;
  },
  rawAll() {
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(STORE_PREFIX)) {
        try { out[k.slice(STORE_PREFIX.length)] = JSON.parse(localStorage.getItem(k)); } catch {}
      }
    }
    return out;
  },
  clearAll() {
    const toDel = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(STORE_PREFIX)) toDel.push(k);
    }
    toDel.forEach(k => localStorage.removeItem(k));
  }
};

const serumAt = (doses, tMs) => {
  let total = 0;
  for (const d of doses) {
    const dtH = (tMs - d.tMs) / 3.6e6;
    if (dtH < 0) continue;
    total += d.dose * Math.pow(0.5, dtH / d.h);
  }
  return total;
};

};
const computeSleepHours = (start, end, awakeMin) => {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  if ([sh, sm, eh, em].some(n => isNaN(n))) return 0;
  let startMin = sh * 60 + sm;
  let endMin = eh * 60 + em;
  if (endMin <= startMin) endMin += 24 * 60;
  const totalMin = Math.max(0, endMin - startMin - (Number(awakeMin) || 0));
  return Math.round(totalMin / 6) / 10;
};

      },

  } catch (e) {
    throw new Error(`Network: ${e.message || e.name || "fetch failed"}`);
  }
  let data;
  try { data = await res.json(); } catch { throw new Error(`Bad JSON (HTTP ${res.status})`); }
  if (!res.ok || data?.error) throw new Error(data?.error?.message || `HTTP ${res.status}`);
  if (!data?.content || !Array.isArray(data.content)) throw new Error("Unexpected response shape");
  return data.content.map(c => c.type === "text" ? c.text : "").filter(Boolean).join("\n");
};
const fileToResizedBase64 = (file, maxDim = 1280) => new Promise((resolve, reject) => {
  if (!file) return reject(new Error("No file"));
  if (!String(file.type || "").startsWith("image/")) return reject(new Error("Not an image file"));
  const reader = new FileReader();
  reader.onerror = () => reject(new Error("Could not read file"));
  reader.onload = e => {
    const img = new Image();
    img.onerror = () => reject(new Error("Could not decode image"));
    img.onload = () => {
      const longest = Math.max(img.width, img.height) || 1;
      const scale = Math.min(1, maxDim / longest);
      const w = Math.max(1, Math.round(img.width * scale));
      const hh = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = hh;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, hh);
      let dataUrl;
      try { dataUrl = canvas.toDataURL("image/jpeg", 0.85); }
      catch (err) { return reject(new Error("Could not encode image")); }
      const base64 = dataUrl.split(",")[1] || "";
      resolve({ base64, mediaType: "image/jpeg", previewUrl: dataUrl, width: w, height: hh });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

  const userText = text && text.trim() ? text.trim() : "";

const REDUCED = typeof matchMedia !== "undefined" && matchMedia("(prefers-reduced-motion: reduce)").matches;
const useCountUp = (value, ms = 380) => {
  const [disp, setDisp] = useState(value);
  const prevRef = useRef(value);
  useEffect(() => {
    const from = prevRef.current, to = value;
    prevRef.current = value;
    if (REDUCED || !isFinite(from) || !isFinite(to) || from === to) { setDisp(to); return; }
    let raf; const t0 = performance.now();
    const step = t => {
      const k = Math.min(1, (t - t0) / ms);
      const e = 1 - Math.pow(1 - k, 3);
      setDisp(Math.round(from + (to - from) * e));
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value, ms]);
  return disp;
};
/* Sheet open/close with exit animation. */
const useSheet = (open, onClosed, ms = 190) => {
  const [closing, setClosing] = useState(false);
  const close = useCallback(() => {
    if (REDUCED) { onClosed(); return; }
    setClosing(true);
    setTimeout(() => { setClosing(false); onClosed(); }, ms);
  }, [onClosed, ms]);
  useEffect(() => { if (!open) setClosing(false); }, [open]);
  return [closing, close];
};

/* ════════════════════════════════════════════════════════════════════
   Serum curve hero — pharmacokinetic estimate
   Math is identical to v1:
   · Lookback per compound = 7 × half-life (covers >99% decay)
   · Steady-state factor R = 1 / (1 − 0.5^(τ/t½)), τ = median dose gap
   · Level shown as % of (avgDose × R) — 100% = saturated for the schedule
   ════════════════════════════════════════════════════════════════════ */
const SerumCurve = ({ allDays }) => {
  const t = useTheme();
  const compoundsData = useMemo(() => {
    const byCompound = {};
    const now = Date.now();
    for (const d of allDays) {
      const dateBase = dateFromKey(d.date).getTime();
      for (const s of d.substances || []) {
        if (!s.time) continue;
        const [hh, mm] = s.time.split(":").map(Number);
        const tMs = dateBase + hh * 3.6e6 + mm * 6e4;
        const halfLife = Number(s.h) || 6;
        const lookbackMs = halfLife * 7 * 3.6e6;
        if (tMs < now - lookbackMs) continue;
        const key = s.libraryId || s.id;
        if (!byCompound[key]) byCompound[key] = { name: s.name, cat: s.cat, h: halfLife, doses: [], unit: s.unit };
        byCompound[key].doses.push({ tMs, dose: Number(s.dose) || 0, h: halfLife });
      }
    }
    for (const key in byCompound) {
      const c = byCompound[key];
      c.doses.sort((a, b) => a.tMs - b.tMs);
      const avgDose = c.doses.reduce((sum, x) => sum + x.dose, 0) / c.doses.length;
      const maxDose = Math.max(...c.doses.map(x => x.dose));
      let interval = null;
      if (c.doses.length >= 2) {
        const gaps = [];
        for (let i = 1; i < c.doses.length; i++) gaps.push((c.doses[i].tMs - c.doses[i - 1].tMs) / 3.6e6);
        gaps.sort((a, b) => a - b);
        interval = gaps[Math.floor(gaps.length / 2)];
      }
      let R = 1;
      if (interval && interval > 0 && c.h > 0) {
        R = 1 / (1 - Math.pow(0.5, interval / c.h));
        if (!isFinite(R) || R <= 0) R = 1;
        if (R > 50) R = 50;
      }
      c.ssPeak = avgDose * R;
      if (!c.ssPeak || c.ssPeak <= 0) c.ssPeak = maxDose;
      c.avgDose = avgDose;
      c.interval = interval;
    }
    return byCompound;
  }, [allDays]);

  const chartData = useMemo(() => {
    const compounds = Object.entries(compoundsData);
    if (!compounds.length) return [];
    const now = Date.now();
    const rows = [];
    for (let dt = -12; dt <= 48; dt += 0.5) {
      const tMs = now + dt * 3.6e6;
      const row = { t: dt };
      for (const [key, c] of compounds) {
        const level = serumAt(c.doses, tMs);
        row[key] = c.ssPeak ? (level / c.ssPeak) * 100 : 0;
        row[`${key}__mg`] = level;
      }
      rows.push(row);
    }
    return rows;
  }, [compoundsData]);

  const compounds = Object.entries(compoundsData);
  const now = Date.now();
  const activeNow = compounds.map(([k, c]) => {
    const lvl = serumAt(c.doses, now);
    const lvlFuture = serumAt(c.doses, now + 3.6e6);
    const pct = c.ssPeak ? (lvl / c.ssPeak) * 100 : 0;
    const phase = phaseFor(pct);
    let trend = "→";
    if (lvlFuture > lvl * 1.02) trend = "↑";
    else if (lvlFuture < lvl * 0.98) trend = "↓";
    return [k, c, { lvl, pct, phase, trend }];
  }).filter(([, , m]) => m.pct > 5).sort((a, b) => b[2].pct - a[2].pct);

  if (!compounds.length) {
    return html`<${Card}><${Empty} icon=${I.Waves} title="No active compounds"
      sub="Log a dose and the serum curve will appear here." /><//>`;
  }

  const fmtMg = (mg, unit) => {
    if (mg >= 100) return `${Math.round(mg)}${unit || ""}`;
    if (mg >= 10) return `${mg.toFixed(1)}${unit || ""}`;
    return `${mg.toFixed(2)}${unit || ""}`;
  };
  const gid = k => `g_${k.replace(/[^a-zA-Z0-9_-]/g, "")}_${t.mode}`;

  return html`<${Card} style=${{ padding: "16px 14px 12px 8px" }}>
    <div style=${{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", padding: "0 4px 8px 10px" }}>
      <div>
        <div style=${{ fontFamily: "var(--font-d)", fontWeight: 700, fontSize: 17.5 }}>Active compounds</div>
        <div style=${{ fontSize: 12.5, color: "var(--sub)", marginTop: 1 }}>Estimated serum level</div>
      </div>
      <div style=${{ fontFamily: "var(--font-m)", fontSize: 11, color: "var(--faint)", textAlign: "right", lineHeight: 1.45, paddingTop: 2 }}>
        % of steady-state<br/><span style=${{ color: "var(--sub)" }}>100% = saturated</span>
      </div>
    </div>
    <div style=${{ height: 196 }}>
      <${ResponsiveContainer}>
        <${ComposedChart} data=${chartData} margin=${{ top: 6, right: 4, left: -26, bottom: 0 }}>
          <defs>
            ${compounds.map(([k, c]) => {
              const col = t.cat[c.cat] || t.ink;
              return html`<linearGradient key=${gid(k)} id=${gid(k)} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor=${col} stopOpacity=${t.mode === "dark" ? 0.34 : 0.22} />
                <stop offset="100%" stopColor=${col} stopOpacity="0" />
              </linearGradient>`;
            })}
          </defs>
          <${CartesianGrid} stroke=${t.chartGrid} strokeDasharray="3 5" vertical=${false} />
          <${XAxis} dataKey="t" type="number" domain=${[-12, 48]}
            ticks=${[-12, 0, 12, 24, 36, 48]}
            tickFormatter=${v => v === 0 ? "now" : `${v > 0 ? "+" : ""}${v}h`}
            tick=${{ fill: t.chartTick, fontSize: 10.5, fontFamily: "Spline Sans Mono" }}
            stroke=${t.chartGrid} tickLine=${false} axisLine=${{ stroke: t.chartGrid }} />
          <${YAxis} domain=${[0, 110]} ticks=${[0, 50, 100]}
            tick=${{ fill: t.chartTick, fontSize: 10.5, fontFamily: "Spline Sans Mono" }}
            stroke=${t.chartGrid} tickLine=${false} axisLine=${false} />
          <${ReferenceLine} y=${100} stroke=${t.line2} strokeDasharray="2 4" />
          <${ReferenceLine} x=${0} stroke=${t.faint} strokeDasharray="3 3" />
          <${Tooltip}
            contentStyle=${{ background: t.card, border: `1px solid ${t.line2}`, borderRadius: 12,
              fontFamily: "Spline Sans Mono", fontSize: 11.5, color: t.ink, boxShadow: "0 8px 22px -10px rgba(0,0,0,0.25)" }}
            labelStyle=${{ color: t.sub, fontWeight: 600 }}
            labelFormatter=${v => v === 0 ? "now" : `${v > 0 ? "+" : ""}${v}h`}
            formatter=${(v, name, item) => {
              if (typeof name === "string" && name.endsWith("__mg")) return null;
              const c = compoundsData[name];
              const mg = item && item.payload ? item.payload[`${name}__mg`] : null;
              const mgStr = (mg != null && c) ? ` · ${fmtMg(mg, c.unit)}` : "";
              return [`${Math.round(v)}%${mgStr}`, (c && c.name) || name];
            }} />
          ${compounds.map(([k, c]) => {
            const col = t.cat[c.cat] || t.ink;
            return html`<${Area} key=${k + t.mode} type="monotone" dataKey=${k}
              stroke=${col} strokeWidth=${2} fill=${`url(#${gid(k)})`}
              dot=${false} activeDot=${{ r: 3.5, strokeWidth: 0 }} isAnimationActive=${false} />`;
          })}
        <//>
      <//>
    </div>
    <div style=${{ borderTop: "1px solid var(--line)", margin: "8px 6px 0 10px", paddingTop: 10 }}>
      ${activeNow.length === 0
        ? html`<div style=${{ fontSize: 13, color: "var(--sub)", paddingBottom: 4 }}>Everything is at trace levels right now.</div>`
        : html`<div style=${{ display: "flex", flexDirection: "column", gap: 7, paddingBottom: 4 }}>
            ${activeNow.map(([k, c, m]) => {
              const col = t.cat[c.cat] || t.ink;
              return html`<div key=${k} style=${{ display: "flex", alignItems: "center", gap: 9 }}>
                <span style=${{ width: 8, height: 8, borderRadius: 99, background: col, flex: "0 0 auto" }} />
                <span style=${{ fontSize: 13.5, fontWeight: 600, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>${c.name}</span>
                <span style=${{ fontSize: 11.5, fontWeight: 700, color: col, background: col + (t.mode === "dark" ? "22" : "16"),
                  border: `1px solid ${col}40`, borderRadius: 99, padding: "2.5px 9px", whiteSpace: "nowrap" }}>${m.phase.label} ${m.trend}</span>
                <span style=${{ fontFamily: "var(--font-m)", fontSize: 11.5, color: "var(--sub)", minWidth: 58, textAlign: "right" }}>${fmtMg(m.lvl, c.unit)}</span>
              </div>`;
            })}
          </div>`}
    </div>
  <//>`;
};

const FoodLogger = ({ meals, hydration, onMealsChange, onHydrationChange, settings }) => {
  const t = useTheme();
  const toast = useToast();
  const [mode, setMode] = useState("ai");
  const [text, setText] = useState("");
  const [image, setImage] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [m, setM] = useState({ name: "", kcal: "", protein: "", carbs: "", fat: "" });
  const fileInputRef = useRef(null);
  const hasKey = Boolean(settings.apiKey);
  const totals = computeTotals(meals);
  const targets = settings.targets || DEFAULT_TARGETS;
  const waterTarget = targets.water || DEFAULT_TARGETS.water;

  const addEntry = entry => {
    onMealsChange([...meals, { ...entry, id: uid(), time: nowTime() }]);
  };
  const onPickFile = async e => {
    const file = e.target.files && e.target.files[0];
    if (e.target) e.target.value = "";
    if (!file) return;
    setErr("");
    try { setImage(await fileToResizedBase64(file)); }
    catch (ex) { setErr(String(ex.message || ex)); }
  };
  const onAI = async () => {
    const hasText = text.trim().length > 0;
    const hasImage = Boolean(image && image.base64);
    if (!hasText && !hasImage) return;
    if (!hasKey) { setErr("Add your API key in settings to enable AI estimates."); return; }
    setBusy(true); setErr("");
    try {
      const res = await estimateMacros({ text, image }, settings);
      addEntry({
        name: res.summary || (hasText ? text.slice(0, 40) : "Photo entry"),
        kcal: res.calories, protein: res.protein, carbs: res.carbs, fat: res.fat
      });
      setText(""); setImage(null);
      toast(`Logged · ${res.calories} kcal`);
    } catch (e) { setErr(String(e.message || e)); }
    finally { setBusy(false); }
  };
  const onManual = () => {
    if (!m.name.trim()) return;
    addEntry({
      name: m.name, kcal: Number(m.kcal) || 0, protein: Number(m.protein) || 0,
      carbs: Number(m.carbs) || 0, fat: Number(m.fat) || 0
    });
    setM({ name: "", kcal: "", protein: "", carbs: "", fat: "" });
    toast("Meal logged");
  };
  const removeEntry = meal => {
    const prev = meals;
    onMealsChange(meals.filter(e => e.id !== meal.id));
    toast(`Removed ${meal.name}`, () => onMealsChange(prev));
  };
  const addWater = amt => {
    onHydrationChange(Math.max(0, hydration + amt));
    if (amt > 0) toast(`+${amt} ml water`);
  };

  return html`<div style=${{ display: "flex", flexDirection: "column", gap: 12 }}>
    <div style=${{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
      <${MacroTile} label="Calories" value=${totals.kcal} target=${targets.calories || DEFAULT_TARGETS.calories} color=${t.cat.lifestyle} />
      <${MacroTile} label="Protein g" value=${totals.protein} target=${targets.protein || DEFAULT_TARGETS.protein} color=${t.cat.health} />
      <${MacroTile} label="Carbs g" value=${totals.carbs} target=${targets.carbs || DEFAULT_TARGETS.carbs} color=${t.cat.steroids} />
      <${MacroTile} label="Fat g" value=${totals.fat} target=${targets.fat || DEFAULT_TARGETS.fat} color=${t.cat.ancillaries} />
    </div>

    <${Card}>

const TrendsView = ({ allDays }) => {
  const t = useTheme();
  const [range, setRange] = useState(14);
  const [groupId, setGroupId] = useState("mood");
  const group = METRIC_GROUPS.find(g => g.id === groupId);
  const color = t.cat[group.catKey];

  const data = useMemo(() => {
    const keys = recentKeys(range);
    return keys.map(k => {
      const day = allDays.find(d => d.date === k);
      const totals = day && day.meals ? computeTotals(day.meals) : { kcal: 0, protein: 0, carbs: 0, fat: 0 };
      const dayWithTotals = day ? { ...day, __totals: totals } : { date: k, __totals: totals };
      const row = { date: k, label: dateFromKey(k).toLocaleDateString(undefined, { month: "numeric", day: "numeric" }) };
      for (const f of group.fields) row[f.k] = getPath(dayWithTotals, f.path) || 0;
      return row;
    });
  }, [allDays, range, groupId]);

  const fieldStats = useMemo(() => group.fields.map(f => {
    const vals = data.map(r => r[f.k]).filter(v => v != null && v !== 0);
    if (!vals.length) return { ...f, avg: 0, min: 0, max: 0, n: 0 };
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    return { ...f, avg: avg.toFixed(1), min: Math.min(...vals), max: Math.max(...vals), n: vals.length };
  }), [data, group]);

  return html`<div style=${{ display: "flex", flexDirection: "column", gap: 12 }}>
    <div className="chiprow">
      ${METRIC_GROUPS.map(g => html`<${Chip} key=${g.id} on=${groupId === g.id} color=${t.cat[g.catKey]}

      options=${RANGE_OPTIONS.map(r => ({ value: r, label: r + "d" }))} />

const fmtInline = s => {
  const parts = [];
  let rest = s, key = 0;
  while (rest.length) {
    const m = rest.match(/\*\*(.+?)\*\*|`([^`]+)`/);
    if (!m) { parts.push(h("span", { key: key++ }, rest)); break; }
    if (m.index > 0) parts.push(h("span", { key: key++ }, rest.slice(0, m.index)));
    if (m[1]) parts.push(h("strong", { key: key++ }, m[1]));
    else if (m[2]) parts.push(h("code", { key: key++ }, m[2]));
    rest = rest.slice(m.index + m[0].length);
  }
  return parts;
};

const renderMarkdown = md => {
  const lines = md.split("\n");
  const out = [];
  lines.forEach((line, i) => {
    if (line.startsWith("## ")) out.push(h("h2", { key: i }, line.slice(3)));
    else if (line.startsWith("### ")) out.push(h("h3", { key: i }, line.slice(4)));
    else if (line.startsWith("# ")) out.push(h("h2", { key: i }, line.slice(2)));
    else if (/^[-*] /.test(line)) out.push(h("div", { key: i, className: "li" },
      h("span", { className: "b" }, "·"), h("span", null, fmtInline(line.slice(2)))));
    else if (/^\d+\. /.test(line)) out.push(h("div", { key: i, className: "li" },
      h("span", { className: "b" }, line.match(/^\d+/)[0] + "."), h("span", null, fmtInline(line.replace(/^\d+\. /, "")))));
    else if (line.trim() === "") out.push(h("div", { key: i, style: { height: 7 } }));
    else out.push(h("div", { key: i }, fmtInline(line)));
  });
  return out;
};

const InsightsView = ({ allDays, settings }) => {

  const [range, setRange] = useState(14);
  const [prompt, setPrompt] = useState("");
  const [busy, setBusy] = useState(false);
  const [busyLabel, setBusyLabel] = useState("");
  const [err, setErr] = useState("");
  const [output, setOutput] = useState("");
  const hasKey = Boolean(settings.apiKey);

  const run = async (customPrompt, label) => {
    if (!hasKey) { setErr("Add your API key in settings to enable insights."); return; }
    const keys = recentKeys(range);
    const logs = keys.map(k => allDays.find(d => d.date === k)).filter(Boolean);
    if (!logs.length) { setErr("No data in the selected range yet."); return; }

const computeRecentSubs = allDays => {
  const cutoff = new Set(recentKeys(14));
  const freq = {}, lastEntry = {};
  for (const d of allDays) {
    if (!cutoff.has(d.date)) continue;
    for (const s of d.substances || []) {
      const lid = s.libraryId || s.id;
      freq[lid] = (freq[lid] || 0) + 1;
      const prev = lastEntry[lid];
      if (!prev || d.date >= prev.date) lastEntry[lid] = { date: d.date, s };
    }
  }
  return Object.keys(freq)
    .sort((a, b) => freq[b] - freq[a])
    .map(lid => {
      const lib = LIBRARY.find(x => x.id === lid);
      if (!lib) return null;
      const last = lastEntry[lid] && lastEntry[lid].s;
      return { ...lib, dose: (last && last.dose) || lib.dose, unit: (last && last.unit) || lib.unit, route: (last && last.route) || lib.route };
    })
    .filter(Boolean)
    .slice(0, 6);
};

const App = () => {
  const [tab, setTab] = useState("today");
  const [currentDate, setCurrentDate] = useState(todayKey());
  const [logSection, setLogSection] = useState("subs");
  const [pickerOpen, setPickerOpen] = useState(false);
  const [pickerPrefill, setPickerPrefill] = useState(null);
  const [editorOpen, setEditorOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [quickOpen, setQuickOpen] = useState(false);
  const [toastItem, setToastItem] = useState(null);
  const toastTimer = useRef(null);
  const undoRef = useRef(null);

  const [settings, setSettings] = useState(() => ({
    apiKey: "",
    macroModel: "claude-haiku-4-5-20251001",
    insightsModel: "claude-sonnet-4-6",
    theme: "auto",
    targets: { ...DEFAULT_TARGETS },
    ...(store.get("settings") || {})
  }));
  const [days, setDays] = useState(() => {
    const keys = store.list("log:");
    const out = {};
    for (const k of keys) {
      const id = k.replace("log:", "");
      const d = store.get(k);
      if (d) out[id] = migrateDay(d);
    }
    return out;
  });

  /* Theme resolution: settings.theme = auto | light | dark */
  const [sysDark, setSysDark] = useState(() =>
    typeof matchMedia !== "undefined" && matchMedia("(prefers-color-scheme: dark)").matches);
  useEffect(() => {
    if (typeof matchMedia === "undefined") return;
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const fn = e => setSysDark(e.matches);
    if (mq.addEventListener) mq.addEventListener("change", fn);
    else mq.addListener(fn);
    return () => { if (mq.removeEventListener) mq.removeEventListener("change", fn); else mq.removeListener(fn); };
  }, []);
  const mode = settings.theme === "light" ? "light" : settings.theme === "dark" ? "dark" : (sysDark ? "dark" : "light");
  useEffect(() => {
    document.documentElement.dataset.theme = mode;
    const meta = document.querySelector('meta[name="theme-color"]:not([media])');
    if (meta) meta.setAttribute("content", mode === "dark" ? "#15110D" : "#F5F4F0");
  }, [mode]);
  const theme = useMemo(() => ({ ...PALETTES[mode], mode }), [mode]);

  /* Persist settings */
  useEffect(() => { store.set("settings", settings); }, [settings]);

  /* Date rollover detection (unchanged from v1) */
  useEffect(() => {
    const id = setInterval(() => {
      const t = todayKey();
      if (t !== currentDate && currentDate === todayKey(new Date(Date.now() - 60000))) {
        setCurrentDate(t);
      }
    }, 30000);
    return () => clearInterval(id);
  }, [currentDate]);

  const day = useMemo(() => migrateDay(days[currentDate] || blankDay(currentDate)), [days, currentDate]);
  const allDays = useMemo(() => Object.values(days), [days]);
  const recentSubs = useMemo(() => computeRecentSubs(allDays), [allDays]);

  const setDay = useCallback(nextDay => {
    setDays(prev => ({ ...prev, [nextDay.date]: nextDay }));
    store.set(`log:${nextDay.date}`, nextDay);
  }, []);

  /* Toast with optional undo */
  const toast = useCallback((msg, undo) => {
    undoRef.current = undo || null;
    setToastItem({ id: Date.now(), msg, undo: Boolean(undo) });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastItem(null), undo ? 5000 : 2400);
  }, []);
  const onUndo = useCallback(() => {
    if (undoRef.current) undoRef.current();
    undoRef.current = null;
    setToastItem(null);
    haptic();
  }, []);

  const onPickSubstance = sub => {
    setPickerPrefill({ ...sub });
    setPickerOpen(false);
    setQuickOpen(false);
    setEditorOpen(true);
  };
  const onSaveSubstance = entry => {
    const newSub = {
      id: uid(),
      libraryId: entry.id,
      name: entry.name,
      cat: entry.cat,
      h: entry.h,
      dose: Number(entry.dose) || 0,
      unit: entry.unit,
      route: entry.route,
      time: entry.time,
      notes: entry.notes || ""
    };
    setDay({ ...day, substances: [...(day.substances || []), newSub] });
    setEditorOpen(false);
    setPickerPrefill(null);
    toast(`Logged ${entry.name}`);
  };
  const onClearAll = () => {
    store.clearAll();
    setDays({});
    setSettings({
      apiKey: "",
      macroModel: "claude-haiku-4-5-20251001",
      insightsModel: "claude-sonnet-4-6",
      theme: "auto",
      targets: { ...DEFAULT_TARGETS }
    });
  };
  const quickWater = amt => {
    const prev = day.hydration_ml || 0;
    setDay({ ...day, hydration_ml: prev + amt });
    setQuickOpen(false);
    toast(`+${amt} ml water`, () => setDay({ ...day, hydration_ml: prev }));
  };
  const quickJump = section => {
    setQuickOpen(false);
    setTab("log");
    setLogSection(section);
  };

  const isToday = currentDate === todayKey();

  return html`<${ThemeCtx.Provider} value=${theme}>
    <${ToastCtx.Provider} value=${toast}>
      <div style=${{ minHeight: "100dvh", paddingBottom: 120 }}>
        <header className="hdr">
          <div className="hdr-in">
            <div className="hdr-row">
              <div style=${{ display: "flex", alignItems: "center", gap: 9 }}>
                <span style=${{ width: 30, height: 30, borderRadius: 10, background: "var(--brand)",
                  color: "var(--on-brand)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <${I.Mark} size=${17} />
                </span>
                <div>
                  <div style=${{ fontFamily: "var(--font-d)", fontWeight: 800, fontSize: 17, lineHeight: 1.1 }}>Vector</div>
                  <div style=${{ fontSize: 11.5, color: "var(--sub)", lineHeight: 1.2 }}>${fmtDateLong(dateFromKey(currentDate))}</div>
                </div>
              </div>
              <button className="iconbtn" aria-label="Settings" onClick=${() => { haptic(); setSettingsOpen(true); }}>
                <${I.Settings} size=${17} />
              </button>
            </div>
            <${WeekStrip} currentDate=${currentDate} days=${days} onPick=${setCurrentDate} />
          </div>
        </header>

        ${!isToday && html`<div className="hdr-in"><div className="pastbar">
          <span>Viewing <b>${fmtDate(dateFromKey(currentDate))}</b></span>
          <button onClick=${() => { haptic(); setCurrentDate(todayKey()); }}>Back to today</button>
        </div></div>`}

        <main className="hdr-in" style=${{ paddingTop: 12 }}>
          ${tab === "today" && html`<${TodayView} day=${day} allDays=${allDays} settings=${settings}
            onJump=${s => { setTab("log"); setLogSection(s); }} />`}
          ${tab === "log" && html`<${LogView} day=${day} settings=${settings} activeSection=${logSection}
            onSection=${setLogSection} onSetDay=${setDay} onOpenPicker=${() => setPickerOpen(true)} />`}
          ${tab === "trends" && html`<${TrendsView} allDays=${allDays} />`}
          ${tab === "insights" && html`<${InsightsView} allDays=${allDays} settings=${settings} />`}
        </main>

        <${Dock} tab=${tab} onTab=${setTab} onPlus=${() => setQuickOpen(true)} />
        <${ToastHost} toast=${toastItem} onUndo=${onUndo} />

        <${QuickAddSheet} open=${quickOpen} onClose=${() => setQuickOpen(false)}
          recent=${recentSubs}
          onWater=${quickWater}
          onDose=${onPickSubstance}
          onBrowse=${() => { setQuickOpen(false); setPickerOpen(true); }}
          onJump=${quickJump} />
        <${SubstancePicker} open=${pickerOpen} onClose=${() => setPickerOpen(false)}
          onPick=${onPickSubstance} recent=${recentSubs} />
        <${SubstanceEditor} open=${editorOpen}
          onClose=${() => { setEditorOpen(false); setPickerPrefill(null); }}
          onSave=${onSaveSubstance} prefill=${pickerPrefill}
          dateLabel=${isToday ? "today" : fmtDate(dateFromKey(currentDate))} />
        <${SettingsSheet} open=${settingsOpen} onClose=${() => setSettingsOpen(false)}
          settings=${settings} onChange=${setSettings} onClearAll=${onClearAll} />
      </div>
    <//>
  <//>`;
};

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
